<li class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl shadow-sm transition-all duration-300 hover:shadow-md hover:bg-slate-100 dark:hover:bg-slate-700 hover:border-slate-300 dark:hover:border-slate-500 group {{ 'border-l-4 border-l-red-500' if task.priority == 'High' else ('border-l-4 border-l-yellow-500' if task.priority == 'Medium' else 'border-l-4 border-l-slate-400') }}" 
    id="task-{{ task.id }}">
    
    <!-- Left Area: Checkbox and Title (Clickable to toggle) -->
    <div class="flex items-center gap-4 w-full cursor-pointer"
         hx-put="/tasks/{{ task.id }}/toggle"
         hx-target="#task-{{ task.id }}"
         hx-swap="outerHTML">
        
        <!-- Custom Checkbox UI -->
        <div class="flex-shrink-0 relative w-6 h-6 flex items-center justify-center rounded-md border-2 transition-colors duration-200 {{ 'bg-blue-500 border-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.5)]' if task.completed else 'border-slate-300 dark:border-slate-400 group-hover:border-blue-400 dark:group-hover:border-blue-400 bg-white dark:bg-slate-800' }}">
            {% if task.completed %}
                <i class="fas fa-check text-white text-xs"></i>
            {% endif %}
        </div>
        
        <!-- Task Text -->
        <div class="flex flex-col">
            <span class="flex-grow text-lg transition-all duration-300 {{ 'line-through text-slate-400 dark:text-slate-500' if task.completed else 'text-slate-700 dark:text-slate-200 group-hover:text-slate-900 dark:group-hover:text-white' }}">
                {{ task.title }}
            </span>
            <div class="flex items-center gap-2 mt-0.5">
                {% if task.due_date %}
                    <span class="text-xs font-medium {{ 'text-slate-400 dark:text-slate-500' if task.completed else ('text-red-500 dark:text-red-400' if task.due_date < now else 'text-slate-500 dark:text-slate-400') }}">
                        <i class="far fa-calendar-alt"></i> {{ task.due_date.strftime('%b %d, %I:%M %p') }}
                    </span>
                {% endif %}
                {% if task.tag %}
                    <span class="bg-slate-200 dark:bg-slate-600 text-slate-700 dark:text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider {{ 'opacity-50' if task.completed else '' }}">
                        {{ task.tag }}
                    </span>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Right Area: Delete Button -->
    <button class="text-slate-400 dark:text-slate-500 hover:text-red-500 dark:hover:text-red-400 transition-colors duration-200 ml-4 focus:outline-none p-2 rounded-lg hover:bg-red-500/10 dark:hover:bg-red-400/10 active:scale-90 opacity-80 hover:opacity-100"
            hx-delete="/tasks/{{ task.id }}"
            hx-target="#task-{{ task.id }}"
            hx-swap="outerHTML swap:300ms">
        <i class="fas fa-trash-alt"></i>
    </button>
</li>
