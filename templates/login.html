{% extends "base.html" %}

{% block content %}


<div class="flex items-center justify-center w-full mt-10">    <!-- Loader -->
    {% include 'components/loader.html' %}

    <!-- Login Card -->
    <div class="w-full max-w-md bg-slate-800/80 backdrop-blur border border-slate-700 p-8 rounded-2xl shadow-2xl transition-all duration-500 opacity-0 transform translate-y-4" id="login-card">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-500/10 text-blue-400 mb-4">
                <i class="fas fa-check-double text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Welcome Back</h1>
            <p class="text-slate-400 text-sm">Sign in to access your tasks.</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg text-sm mb-6 flex items-center gap-2">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1" for="username">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fas fa-user"></i>
                    </div>
                    <input type="text" name="username" id="username" required
                           class="w-full pl-10 bg-slate-900/50 border border-slate-700 text-slate-100 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-inner">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1" for="password">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input type="password" name="password" id="password" required
                           class="w-full pl-10 bg-slate-900/50 border border-slate-700 text-slate-100 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-inner">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-3 rounded-xl transition-all shadow-lg shadow-blue-500/20 active:scale-[0.98] duration-200 mt-2">
                Sign In
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-400">
            Don't have an account? 
            <a href="/register" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Register here</a>
        </p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loader = document.getElementById('loader-overlay');
            const card = document.getElementById('login-card');
            
            // Fade out loader and fade in card after 1.5 seconds
            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                
                // Show the card
                card.classList.remove('opacity-0', 'translate-y-4');
                card.classList.add('opacity-100', 'translate-y-0');
            }, 1500);
        });
    </script>
    </div>
</div>
{% endblock %}
